# ==============================================================================
# Picom Configuration - Optimized for Dual-GPU (Intel UHD 620 + AMD Radeon)
# ==============================================================================

# Backend: GLX rendering is required for tear-free vsync and smooth compositing
backend = "glx";

# GLX backend fine-tuning for hybrid Intel/AMD DRI PRIME
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
use-damage = true;
vsync = true;

# Do not unredirect fullscreen windows to avoid screen tearing and flickering
# when switching between Intel iGPU and AMD dGPU DRI_PRIME offloaded windows
unredir-if-possible = false;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.60;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@"
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 6;

# Transparency / Opacity
inactive-opacity = 0.95;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;
focus-exclude = [
  "class_g = 'Cairo-clock'",
  "class_g = 'Bar'",
  "class_g = 'slop'"
];

# Rounded corners (Clean, modern look)
corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];

# Wintypes
wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; }
  dmenu = { shadow = false; }
  dropdown_menu = { opacity = 0.95; }
  popup_menu = { opacity = 0.95; }
};

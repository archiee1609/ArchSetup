;==========================================================
; Polybar Configuration for BSPWM
;==========================================================

[colors]
background = #11111b
background-alt = #1e1e2e
foreground = #cdd6f4
primary = #89b4fa
secondary = #f5e0dc
alert = #f38ba8
disabled = #45475a

[bar/main]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
padding-left = 1
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:size=10;2"

modules-left = bspwm xwindow
modules-right = cpu memory battery pulseaudio date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
tray-position = right
tray-padding = 2

[module/bspwm]
type = internal/bspwm

label-focused = %name%
label-focused-background = ${colors.background-alt}
label-focused-underline= ${colors.primary}
label-focused-padding = 2

label-occupied = %name%
label-occupied-padding = 2

label-urgent = %name%!
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:40:...%

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.primary}
format-volume = <label-volume>

label-volume = %percentage%%

label-muted = "󰖁 muted"
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
format-prefix = "󰍛 "
format-prefix-foreground = #f9e2af
label = %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "󰻠 "
format-prefix-foreground = #a6e3a1
label = %percentage:2%%

[module/battery]
type = internal/battery
full-at = 98
low-at = 15
battery = BAT0
adapter = ADP1
poll-interval = 5

format-charging = <label-charging>
format-charging-prefix = "󰂄 "
format-charging-prefix-foreground = #a6e3a1
label-charging = %percentage%%

format-discharging = <label-discharging>
format-discharging-prefix = "󰁹 "
format-discharging-prefix-foreground = #f5c2e7
label-discharging = %percentage%%

format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-foreground = #a6e3a1
label-full = 100%

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true
pseudo-transparency = true

# ==============================================================================
# Alacritty Configuration (Modern TOML format for Alacritty 0.13+)
# ==============================================================================

[general]
import = [
    "~/.config/bspwm/alacritty/colors.toml"
]

[window]
dimensions = { columns = 110, lines = 30 }
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.95
decorations = "full"
title = "Alacritty"

[font]
size = 11.0
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500

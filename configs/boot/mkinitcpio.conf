# mkinitcpio.conf for Intel UHD 620 + AMD Radeon R5 M330 (Oland) & Btrfs
# Early KMS: i915 (primary display controller) followed by amdgpu (dGPU)
MODULES=(i915 amdgpu)

# Binaries to add to the image
BINARIES=()

# Files to add to the image
FILES=()

# Hooks:
# 'microcode' handles early CPU microcode updates
# 'kms' enables early kernel mode setting
# 'btrfs' enables multi-device Btrfs scanning and subvolume mounting
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block btrfs filesystems fsck)

# Compression algorithm
COMPRESSION="zstd"

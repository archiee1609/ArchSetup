# /etc/tlp.d/00-i5-8250u-throttling.conf
# Tuned TLP profile for Intel Core i5-8250U (15W TDP) and AMD Radeon R5 M330

# Enable TLP
TLP_ENABLE=1
TLP_WARN_LEVEL=3

# CPU Frequency Scaling & Energy Performance Preferences
# The 8250U uses intel_pstate. 'powersave' is the proper governor for HWP.
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Balance performance to prevent instant 90C+ spikes causing thermal throttle crashes
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power

# Limit maximum frequency ceiling on battery to preserve battery and thermal headroom
CPU_MIN_PERF_ON_AC=0
CPU_MAX_PERF_ON_AC=100
CPU_MIN_PERF_ON_BAT=0
CPU_MAX_PERF_ON_BAT=70

# CPU Turbo Boost: Enable on AC, disable on battery to stop aggressive heat cycles
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Intel Dynamic Platform and Thermal Framework integration
# Works hand-in-hand with systemd thermald.service

# SATA Link Power Management (dual SATA SSDs)
SATA_LINKPWR_ON_AC="med_power_with_dipm max_performance"
SATA_LINKPWR_ON_BAT="med_power_with_dipm min_power"

# PCIe ASPM (Active State Power Management)
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

# Runtime Power Management for PCIe bus devices (Crucial for dGPU power-down)
RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# AMD Radeon R5 M330 Dynamic Power Management
# Keeps Radeon dGPU suspended until invoked via DRI_PRIME=1 prime-run
RADEON_DPM_STATE_ON_AC=performance
RADEON_DPM_STATE_ON_BAT=battery
RADEON_POWER_PROFILE_ON_AC=default
RADEON_POWER_PROFILE_ON_BAT=low

# USB Autosuspend
USB_AUTOSUSPEND=1
